name: Downstream lookup scope fail-fast

on:
  push:
    branches: [work/lmcache-lookup-qualification]
    paths:
      - .github/workflows/downstream-lookup-scope-failfast.yaml

permissions:
  contents: read

jobs:
  cpu-contract:
    if: github.repository == 'kvnloo/ATOM'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CUDA_VISIBLE_DEVICES: ''
      ROCR_VISIBLE_DEVICES: ''
    steps:
      - name: Check out candidate with history
        uses: actions/checkout@v6
        with:
          ref: c9f1b7bd601992f33aee71a65d979bd5ea623f02
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install one CPU environment
        shell: bash
        env:
          EVIDENCE: ${{ runner.temp }}/scope-evidence
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          python -m venv "$RUNNER_TEMP/scope-venv"
          source "$RUNNER_TEMP/scope-venv/bin/activate"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_ATOM=0.0.0+cpu.scope python -m pip install -e .
          python -m pip install pytest msgpack quart jsonschema av pillow httpx black ruff
          python -m pip freeze --all | tee "$EVIDENCE/dependencies-before.txt"

      - name: Prove metadata boundary original red, candidate green, original red
        shell: bash
        env:
          EVIDENCE: ${{ runner.temp }}/scope-evidence
        timeout-minutes: 5
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/scope-venv/bin/activate"
          BASE=68e0df5e7cc0e9eff9b5f8155ddb99bdcb43b32e
          HEAD=c9f1b7bd601992f33aee71a65d979bd5ea623f02
          TEST=tests/test_lmcache_offload_config.py
          cp "$TEST" "$RUNNER_TEMP/scope-test.py"

          run_arm() {
            local name="$1"
            local ref="$2"
            git checkout --detach "$ref" >/dev/null
            cp "$RUNNER_TEMP/scope-test.py" "$TEST"
            set +e
            PYTHONPATH="$PWD" python -m pytest "$TEST" -q -rs \
              -k 'lmcache_metadata_rejects_lookup_scope_outside_replica_world or lmcache_metadata_accepts_lookup_scope_within_replica_world' \
              --junitxml="$EVIDENCE/${name}.xml" >"$EVIDENCE/${name}.log" 2>&1
            local rc=$?
            set -e
            printf '%s\n' "$rc" >"$EVIDENCE/${name}.exit"
            git reset --hard HEAD >/dev/null
            git clean -fd >/dev/null
          }

          run_arm original "$BASE"
          run_arm candidate "$HEAD"
          run_arm restored "$BASE"

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          evidence = Path(os.environ["EVIDENCE"])
          receipt = {"status": "IN_PROGRESS", "arms": {}}
          for name in ["original", "candidate", "restored"]:
              root = ET.parse(evidence / f"{name}.xml").getroot()
              cases = {}
              for item in root.iter("testcase"):
                  key = item.get("name")
                  assert key not in cases
                  status = "passed"
                  detail = ""
                  for tag in ["error", "failure", "skipped"]:
                      child = item.find(tag)
                      if child is not None:
                          status = tag
                          detail = child.get("message", "") + "\n" + (child.text or "")
                          break
                  cases[key] = {"status": status, "detail": detail}
              receipt["arms"][name] = {
                  "exit_code": int((evidence / f"{name}.exit").read_text()),
                  "cases": cases,
              }

          original, candidate, restored = [
              receipt["arms"][name] for name in ["original", "candidate", "restored"]
          ]
          assert len(original["cases"]) == len(candidate["cases"]) == len(restored["cases"]) == 6
          assert original["cases"].keys() == candidate["cases"].keys() == restored["cases"].keys()
          expected_red = {
              key
              for key in original["cases"]
              if key.startswith("test_lmcache_metadata_rejects_lookup_scope_outside_replica_world[")
          }
          assert len(expected_red) == 3
          for arm in [original, restored]:
              assert arm["exit_code"] == 1
              failed = {
                  key
                  for key, result in arm["cases"].items()
                  if result["status"] in {"failure", "error"}
              }
              assert failed == expected_red
              assert all("DID NOT RAISE" in arm["cases"][key]["detail"] for key in expected_red)
              assert all(
                  result["status"] == "passed"
                  for key, result in arm["cases"].items()
                  if key not in expected_red
              )
          assert candidate["exit_code"] == 0
          assert all(result["status"] == "passed" for result in candidate["cases"].values())
          receipt["status"] = "LOOKUP_SCOPE_METADATA_GATE_PASSED"
          (evidence / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(receipt["status"])
          PY

      - name: Run focused config and scheduler suites with style checks
        shell: bash
        env:
          EVIDENCE: ${{ runner.temp }}/scope-evidence
        timeout-minutes: 8
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/scope-venv/bin/activate"
          git checkout --detach c9f1b7bd601992f33aee71a65d979bd5ea623f02 >/dev/null
          PYTHONPATH="$PWD" python -m pytest \
            tests/test_lmcache_offload_config.py \
            tests/test_dense_offload_connector.py \
            -q -rs --junitxml="$EVIDENCE/focused.xml" 2>&1 | tee "$EVIDENCE/focused.log"
          python -m black --check \
            atom/kv_transfer/offload/config.py \
            tests/test_lmcache_offload_config.py 2>&1 | tee "$EVIDENCE/black.log"
          python -m ruff check \
            atom/kv_transfer/offload/config.py \
            tests/test_lmcache_offload_config.py 2>&1 | tee "$EVIDENCE/ruff.log"
          git diff --check 68e0df5e7cc0e9eff9b5f8155ddb99bdcb43b32e HEAD | tee "$EVIDENCE/diff-check.log"
          python -m pip freeze --all > "$EVIDENCE/dependencies-after.txt"
          cmp "$EVIDENCE/dependencies-before.txt" "$EVIDENCE/dependencies-after.txt"

      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lookup-scope-failfast-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scope-evidence/
          if-no-files-found: error
          retention-days: 14
