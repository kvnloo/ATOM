name: Downstream offload profile semantics

on:
  push:
    branches: [work/lmcache-lookup-qualification]
    paths:
      - .github/workflows/downstream-offload-profile-semantics.yaml

permissions:
  contents: read

jobs:
  cpu-contract:
    if: github.repository == 'kvnloo/ATOM'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CUDA_VISIBLE_DEVICES: ''
      ROCR_VISIBLE_DEVICES: ''
    steps:
      - name: Check out candidate with history
        uses: actions/checkout@v6
        with:
          ref: fc0aa76b45b31461b64108e65cb61bff1b3c5381
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install one CPU environment
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir evidence
          python -m venv "$RUNNER_TEMP/profile-venv"
          source "$RUNNER_TEMP/profile-venv/bin/activate"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_ATOM=0.0.0+cpu.profile python -m pip install -e .
          python -m pip install pytest msgpack quart jsonschema av pillow httpx black ruff
          python -m pip freeze --all | tee evidence/dependencies-before.txt

      - name: Prove original red, candidate green, original red
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/profile-venv/bin/activate"
          BASE=68e0df5e7cc0e9eff9b5f8155ddb99bdcb43b32e
          TEST=tests/test_offload_profile_logging.py
          cp "$TEST" "$RUNNER_TEMP/profile-test.py"

          run_arm() {
            local name="$1"
            local ref="$2"
            git checkout --detach "$ref" >/dev/null
            cp "$RUNNER_TEMP/profile-test.py" "$TEST"
            set +e
            PYTHONPATH="$PWD" python -m pytest "$TEST" -q -rs \
              --junitxml="evidence/${name}.xml" >"evidence/${name}.log" 2>&1
            local rc=$?
            set -e
            printf '%s\n' "$rc" >"evidence/${name}.exit"
            git reset --hard HEAD >/dev/null
            git clean -fd >/dev/null
          }

          run_arm original "$BASE"
          run_arm candidate fc0aa76b45b31461b64108e65cb61bff1b3c5381
          run_arm restored "$BASE"

          python - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET

          expected_red = {
              'test_profile_stat_distinguishes_unmeasured_from_measured_zero',
              'test_dense_load_profile_preserves_unmeasured_timing_state[unmeasured]',
              'test_dense_save_profile_preserves_unmeasured_timing_state[unmeasured]',
              'test_dsv4_load_profile_uses_the_same_unmeasured_contract[unmeasured]',
          }
          receipt = {'status': 'IN_PROGRESS', 'arms': {}, 'expected_red': sorted(expected_red)}
          for name in ['original', 'candidate', 'restored']:
              root = ET.parse(f'evidence/{name}.xml').getroot()
              cases = {}
              for item in root.iter('testcase'):
                  key = item.get('name')
                  assert key not in cases
                  status = 'passed'
                  detail = ''
                  for tag in ['error', 'failure', 'skipped']:
                      child = item.find(tag)
                      if child is not None:
                          status = tag
                          detail = child.get('message', '') + '\n' + (child.text or '')
                          break
                  cases[key] = {'status': status, 'detail': detail}
              rc = int(Path(f'evidence/{name}.exit').read_text())
              receipt['arms'][name] = {'exit_code': rc, 'cases': cases}
          a, b, c = [receipt['arms'][name] for name in ['original', 'candidate', 'restored']]
          assert len(a['cases']) == len(b['cases']) == len(c['cases']) == 7
          assert a['cases'].keys() == b['cases'].keys() == c['cases'].keys()
          for arm in [a, c]:
              assert arm['exit_code'] == 1
              failed = {k for k, v in arm['cases'].items() if v['status'] in {'failure', 'error'}}
              assert failed == expected_red
              for key in expected_red - {'test_profile_stat_distinguishes_unmeasured_from_measured_zero'}:
                  assert 'pack_ms=nan' in arm['cases'][key]['detail']
          assert b['exit_code'] == 0
          assert all(v['status'] == 'passed' for v in b['cases'].values())
          receipt['status'] = 'PROFILE_CONTRACT_GATE_PASSED'
          Path('evidence/receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(receipt['status'])
          PY

      - name: Run focused existing suites and style checks on candidate
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/profile-venv/bin/activate"
          git checkout --detach fc0aa76b45b31461b64108e65cb61bff1b3c5381 >/dev/null
          PYTHONPATH="$PWD" python -m pytest \
            tests/test_offload_profile_logging.py \
            tests/test_offload_transfer_instrumentation.py \
            tests/test_dense_offload_connector.py \
            tests/test_lmcache_offload_connector.py \
            -q -rs --junitxml=evidence/focused.xml 2>&1 | tee evidence/focused.log
          python -m black --check \
            atom/kv_transfer/offload/_offload_common.py \
            atom/kv_transfer/offload/dense/connector.py \
            atom/kv_transfer/offload/hybrid/dsv4/connector.py \
            tests/test_offload_profile_logging.py 2>&1 | tee evidence/black.log
          python -m ruff check \
            atom/kv_transfer/offload/_offload_common.py \
            atom/kv_transfer/offload/dense/connector.py \
            atom/kv_transfer/offload/hybrid/dsv4/connector.py \
            tests/test_offload_profile_logging.py 2>&1 | tee evidence/ruff.log
          git diff --check 68e0df5e7cc0e9eff9b5f8155ddb99bdcb43b32e HEAD | tee evidence/diff-check.log
          python -m pip freeze --all > evidence/dependencies-after.txt
          cmp evidence/dependencies-before.txt evidence/dependencies-after.txt

      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: offload-profile-semantics-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
