name: Downstream perf regression missing metrics

on:
  push:
    branches: [work/lmcache-lookup-qualification]
    paths:
      - .github/workflows/downstream-perf-regression-missing-metrics.yaml

permissions:
  contents: read

jobs:
  cpu-contract:
    if: github.repository == 'kvnloo/ATOM'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      BASE_SHA: e3accb680fbc4d914f80bdf53b37f5bf2e8c29ab
      CANDIDATE_SHA: e982f891e366ee13ac30312042f8e8edc2bfc9d2
      EVIDENCE: /tmp/perf-regression-missing-evidence
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install CPU test tools
        run: |
          python -m pip install pytest black ruff
          mkdir -p "$EVIDENCE"
          python -m pip freeze --all > "$EVIDENCE/dependencies-before.txt"
      - name: Prove missing-is-zero red, unknown-is-unknown green, restored red
        shell: bash
        run: |
          set -euo pipefail
          TEST=tests/benchmarks/test_regression_missing_metrics.py
          cp "$TEST" "$RUNNER_TEMP/regression-missing-test.py"

          run_case() {
            local arm="$1"
            local ref="$2"
            local test_name="$3"
            git checkout --detach "$ref" >/dev/null
            mkdir -p tests/benchmarks
            cp "$RUNNER_TEMP/regression-missing-test.py" "$TEST"
            set +e
            python -m pytest "$TEST::${test_name}" -q >"$EVIDENCE/${arm}-${test_name}.log" 2>&1
            local rc=$?
            set -e
            printf '%s\n' "$rc" > "$EVIDENCE/${arm}-${test_name}.exit"
            git reset --hard HEAD >/dev/null
            git clean -fd >/dev/null
          }

          TESTS=(
            test_missing_current_throughput_is_not_a_synthetic_regression
            test_missing_baseline_latency_is_not_an_infinite_regression
            test_other_comparable_metric_can_still_trigger
          )
          for test_name in "${TESTS[@]}"; do
            run_case original "$BASE_SHA" "$test_name"
            run_case candidate "$CANDIDATE_SHA" "$test_name"
            run_case restored "$BASE_SHA" "$test_name"
          done

          python - <<'PY'
          import os
          from pathlib import Path
          evidence = Path(os.environ["EVIDENCE"])
          tests = (
              "test_missing_current_throughput_is_not_a_synthetic_regression",
              "test_missing_baseline_latency_is_not_an_infinite_regression",
              "test_other_comparable_metric_can_still_trigger",
          )
          for test_name in tests:
              assert int((evidence / f"original-{test_name}.exit").read_text()) == 1
              assert int((evidence / f"candidate-{test_name}.exit").read_text()) == 0
              assert int((evidence / f"restored-{test_name}.exit").read_text()) == 1
          print("PERF_REGRESSION_MISSING_RED_GREEN_RED_PASSED")
          PY
      - name: Candidate style and focused checks
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$CANDIDATE_SHA" >/dev/null
          python -m pytest             tests/benchmarks/test_regression_trigger_metrics.py             tests/benchmarks/test_regression_missing_metrics.py -q
          python -m black --check             .github/scripts/summarize.py             tests/benchmarks/test_regression_trigger_metrics.py             tests/benchmarks/test_regression_missing_metrics.py
          python -m ruff check             .github/scripts/summarize.py             tests/benchmarks/test_regression_trigger_metrics.py             tests/benchmarks/test_regression_missing_metrics.py
          git diff --check "$BASE_SHA" HEAD
          python -m pip freeze --all > "$EVIDENCE/dependencies-after.txt"
          cmp "$EVIDENCE/dependencies-before.txt" "$EVIDENCE/dependencies-after.txt"
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: perf-regression-missing-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/perf-regression-missing-evidence/
          if-no-files-found: error
          retention-days: 14
