name: Downstream MoRIIO index-state fail-closed

on:
  push:
    branches: [work/lmcache-lookup-qualification]
    paths:
      - .github/workflows/downstream-moriio-index-state-failclosed.yaml

permissions:
  contents: read

jobs:
  cpu-contract:
    if: github.repository == 'kvnloo/ATOM'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      BASE_SHA: 68e0df5e7cc0e9eff9b5f8155ddb99bdcb43b32e
      CANDIDATE_SHA: 90a49d46bd095e7bd810b4fac149d87495944d93
    steps:
      - name: Check out candidate with history
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install one CPU environment
        timeout-minutes: 12
        shell: bash
        env:
          EVIDENCE: ${{ runner.temp }}/moriio-index-evidence
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          python -m venv "$RUNNER_TEMP/moriio-index-venv"
          source "$RUNNER_TEMP/moriio-index-venv/bin/activate"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_ATOM=0.0.0+cpu.moriioindex python -m pip install -e .
          python -m pip install pytest msgpack quart jsonschema av pillow httpx black ruff
          python -m pip freeze --all > "$EVIDENCE/dependencies-before.txt"

      - name: Prove silent acceptance red, fail-closed green, silent acceptance red
        timeout-minutes: 5
        shell: bash
        env:
          EVIDENCE: ${{ runner.temp }}/moriio-index-evidence
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/moriio-index-venv/bin/activate"
          TEST=tests/test_moriio_registration_contract.py
          cp "$TEST" "$RUNNER_TEMP/moriio-index-test.py"

          run_arm() {
            local name="$1"
            local ref="$2"
            git checkout --detach "$ref" >/dev/null
            cp "$RUNNER_TEMP/moriio-index-test.py" "$TEST"
            set +e
            PYTHONPATH="$PWD" python -m pytest "$TEST" -q -rs \
              --junitxml="$EVIDENCE/${name}.xml" >"$EVIDENCE/${name}.log" 2>&1
            local rc=$?
            set -e
            printf '%s\n' "$rc" >"$EVIDENCE/${name}.exit"
            git reset --hard HEAD >/dev/null
            git clean -fd >/dev/null
          }

          run_arm original "$BASE_SHA"
          run_arm candidate "$CANDIDATE_SHA"
          run_arm restored "$BASE_SHA"

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          evidence = Path(os.environ["EVIDENCE"])
          receipt = {"status": "IN_PROGRESS", "arms": {}}
          for name in ("original", "candidate", "restored"):
              root = ET.parse(evidence / f"{name}.xml").getroot()
              cases = {}
              for case in root.iter("testcase"):
                  key = case.get("name")
                  status = "passed"
                  detail = ""
                  for tag in ("error", "failure", "skipped"):
                      node = case.find(tag)
                      if node is not None:
                          status = tag
                          detail = (node.get("message") or "") + "\n" + (node.text or "")
                          break
                  cases[key] = {"status": status, "detail": detail}
              receipt["arms"][name] = {
                  "exit_code": int((evidence / f"{name}.exit").read_text()),
                  "cases": cases,
              }

          original, candidate, restored = (
              receipt["arms"]["original"],
              receipt["arms"]["candidate"],
              receipt["arms"]["restored"],
          )
          assert original["cases"].keys() == candidate["cases"].keys() == restored["cases"].keys()
          assert len(candidate["cases"]) == 3
          expected_red = {
              key
              for key in original["cases"]
              if key.startswith("test_moriio_rejects_index_state_it_does_not_transfer[")
          }
          assert len(expected_red) == 2
          for arm in (original, restored):
              assert arm["exit_code"] == 1
              failed = {
                  key
                  for key, result in arm["cases"].items()
                  if result["status"] in {"failure", "error"}
              }
              assert failed == expected_red
              assert all("DID NOT RAISE" in arm["cases"][key]["detail"] for key in expected_red)
              assert arm["cases"]["test_moriio_plain_mla_registration_remains_available"]["status"] == "passed"
          assert candidate["exit_code"] == 0
          assert all(result["status"] == "passed" for result in candidate["cases"].values())
          receipt["status"] = "MORIIO_INDEX_STATE_FAIL_CLOSED_GATE_PASSED"
          (evidence / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(receipt["status"])
          PY

      - name: Run candidate contract and style checks
        timeout-minutes: 5
        shell: bash
        env:
          EVIDENCE: ${{ runner.temp }}/moriio-index-evidence
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/moriio-index-venv/bin/activate"
          git checkout --detach "$CANDIDATE_SHA" >/dev/null
          PYTHONPATH="$PWD" python -m pytest tests/test_moriio_registration_contract.py -q -rs \
            --junitxml="$EVIDENCE/focused.xml" 2>&1 | tee "$EVIDENCE/focused.log"
          python -m black --check \
            atom/kv_transfer/disaggregation/moriio/moriio_connector.py \
            tests/test_moriio_registration_contract.py 2>&1 | tee "$EVIDENCE/black.log"
          python -m ruff check \
            atom/kv_transfer/disaggregation/moriio/moriio_connector.py \
            tests/test_moriio_registration_contract.py 2>&1 | tee "$EVIDENCE/ruff.log"
          git diff --check "$BASE_SHA" HEAD | tee "$EVIDENCE/diff-check.log"
          python -m pip freeze --all > "$EVIDENCE/dependencies-after.txt"
          cmp "$EVIDENCE/dependencies-before.txt" "$EVIDENCE/dependencies-after.txt"

      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: moriio-index-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/moriio-index-evidence/
          if-no-files-found: error
          retention-days: 14
