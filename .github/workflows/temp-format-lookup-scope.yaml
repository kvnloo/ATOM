name: Temp format lookup scope test

on:
  push:
    branches: [fix/lmcache-lookup-scope-validation]
    paths:
      - .github/workflows/temp-format-lookup-scope.yaml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'kvnloo/ATOM'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/lmcache-lookup-scope-validation
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install black==26.5.1
      - name: Apply repository Black formatting
        run: python -m black --fast tests/test_lmcache_offload_config.py
      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tests/test_lmcache_offload_config.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_lmcache_offload_config.py
          git commit -m "style(offload): apply Black to lookup scope test"
          git push origin HEAD:fix/lmcache-lookup-scope-validation
