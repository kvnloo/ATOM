name: Downstream perf regression trigger metrics

on:
  push:
    branches: [work/lmcache-lookup-qualification]
    paths:
      - .github/workflows/downstream-perf-regression-trigger-metrics.yaml

permissions:
  contents: read

jobs:
  cpu-contract:
    if: github.repository == 'kvnloo/ATOM'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      BASE_SHA: 68e0df5e7cc0e9eff9b5f8155ddb99bdcb43b32e
      CANDIDATE_SHA: e3accb680fbc4d914f80bdf53b37f5bf2e8c29ab
      EVIDENCE: ${{ runner.temp }}/perf-regression-trigger-evidence
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install CPU test tools
        run: |
          python -m pip install pytest black ruff
          mkdir -p "$EVIDENCE"
          python -m pip freeze --all > "$EVIDENCE/dependencies-before.txt"
      - name: Prove hidden trigger original red, candidate green, original red
        shell: bash
        run: |
          set -euo pipefail
          TEST=tests/benchmarks/test_regression_trigger_metrics.py
          cp "$TEST" "$RUNNER_TEMP/regression-trigger-test.py"

          run_arm() {
            local name="$1"
            local ref="$2"
            git checkout --detach "$ref" >/dev/null
            mkdir -p tests/benchmarks
            cp "$RUNNER_TEMP/regression-trigger-test.py" "$TEST"
            set +e
            python -m pytest "$TEST" -q --junitxml="$EVIDENCE/${name}.xml" >"$EVIDENCE/${name}.log" 2>&1
            local rc=$?
            set -e
            printf '%s\n' "$rc" > "$EVIDENCE/${name}.exit"
            git reset --hard HEAD >/dev/null
            git clean -fd >/dev/null
          }

          run_arm original "$BASE_SHA"
          run_arm candidate "$CANDIDATE_SHA"
          run_arm restored "$BASE_SHA"

          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          evidence = Path(os.environ["EVIDENCE"])
          arms = {}
          for name in ("original", "candidate", "restored"):
              root = ET.parse(evidence / f"{name}.xml").getroot()
              cases = {}
              for case in root.iter("testcase"):
                  status = "passed"
                  detail = ""
                  for tag in ("failure", "error", "skipped"):
                      node = case.find(tag)
                      if node is not None:
                          status = tag
                          detail = (node.get("message") or "") + chr(10) + (node.text or "")
                          break
                  cases[case.get("name")] = (status, detail)
              arms[name] = {
                  "exit": int((evidence / f"{name}.exit").read_text()),
                  "cases": cases,
              }

          expected = {
              "test_hidden_ttft_trigger_is_explicit",
              "test_multiple_trigger_metrics_preserve_classifier_semantics",
          }
          for name in ("original", "restored"):
              assert arms[name]["exit"] == 1
              failed = {k for k, (status, _) in arms[name]["cases"].items() if status == "failure"}
              assert failed == expected
          assert arms["candidate"]["exit"] == 0
          assert all(status == "passed" for status, _ in arms["candidate"]["cases"].values())
          print("PERF_REGRESSION_TRIGGER_RED_GREEN_RED_PASSED")
          PY

      - name: Candidate style and focused checks
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$CANDIDATE_SHA" >/dev/null
          python -m pytest tests/benchmarks/test_regression_trigger_metrics.py -q
          python -m black --check .github/scripts/summarize.py tests/benchmarks/test_regression_trigger_metrics.py
          python -m ruff check .github/scripts/summarize.py tests/benchmarks/test_regression_trigger_metrics.py
          git diff --check "$BASE_SHA" HEAD
          python -m pip freeze --all > "$EVIDENCE/dependencies-after.txt"
          cmp "$EVIDENCE/dependencies-before.txt" "$EVIDENCE/dependencies-after.txt"
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: perf-regression-trigger-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/perf-regression-trigger-evidence/
          if-no-files-found: error
          retention-days: 14
